name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  evals:
    # The gate. A pull request that regresses a metric past its declared
    # tolerance fails here, which is the entire reason the harness was built
    # before the agent graphs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run eval suites against committed baselines
        run: evalctl run --markdown evals/runs/report.md

      - name: Publish report to the job summary
        if: always()
        run: cat evals/runs/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the eval diff on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'evals/runs/report.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: payload,
              });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/runs/report.md

  schema:
    # Catches a schema.sql that no longer applies -- including the pgvector
    # and PostGIS extensions both projects assume are present.
    #
    # Also the only job with a database, so it is where retrieval parity runs.
    # The eval job scores the offline Python mirror; without this step nothing
    # would ever check that the SQL those numbers are supposed to describe
    # ranks the same way. It did not, for a while, and nobody could have known.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the combined pgvector + PostGIS image
        run: docker build -t sightline-db ./infra/postgres
      - name: Apply both schemas to a fresh database
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=app -e POSTGRES_USER=app \
            -e POSTGRES_DB=app -p 5433:5432 sightline-db
          for i in $(seq 1 30); do
            docker exec db pg_isready -U app -d app && break
            sleep 2
          done
          docker exec db psql -U app -d app -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS postgis;"
          docker exec -i db psql -U app -d app -v ON_ERROR_STOP=1 < ledgerline/schema.sql
          docker exec -i db psql -U app -d app -v ON_ERROR_STOP=1 < sightline/schema.sql
          # Idempotence is a requirement, not an accident -- apply twice.
          docker exec -i db psql -U app -d app -v ON_ERROR_STOP=1 < ledgerline/schema.sql
          docker exec -i db psql -U app -d app -v ON_ERROR_STOP=1 < sightline/schema.sql

      - run: pip install -e ".[dev]"

      - name: Retrieval parity -- Postgres against the offline mirror
        # Fails if the dense arms disagree. They read the same committed
        # vectors and order by the same metric, so a difference there is a
        # defect in the write path, not a tuning question. Lexical divergence
        # is printed and not gated: BM25 and ts_rank_cd are different
        # algorithms and always will be.
        env:
          DATABASE_URL: postgresql://app:app@localhost:5433/app
        run: ledgerline parity

      - name: Database-backed tests
        # These skip in the `test` job, which has no database. Running them
        # here is what stops that skip from being a permanent hole.
        env:
          DATABASE_URL: postgresql://app:app@localhost:5433/app
        run: pytest tests/test_sql_parity.py -q

